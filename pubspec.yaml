name: unilib
description: Universal Library - Offline AI Model App for Students.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  dio: ^5.4.0
  flutter_edge_ai: 2.1.2
  flutter_edge_ai_litertlm: 1.11.3
  flutter_edge_ai_embeddings: 2.2.2
  flutter_edge_ai_rag: 1.0.0
  flutter_edge_ai_sqlite: 2.0.1
  crypto: ^3.0.6
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_markdown: ^0.6.18
  flutter_tts: ^3.8.3
  image_picker: ^1.0.7
  speech_to_text: ^6.6.1
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_screenutil: ^5.9.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - rag_output/biology/Biology_RAG_chunks.jsonl
    - rag_output/chemistry/Chemistry_RAG_chunks.jsonl
    - rag_output/physics/Physics_RAG_chunks.jsonl
